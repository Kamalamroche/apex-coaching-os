/* Athletic Tech: navy field, orange = act, blue = coach/structure, cyan = data. Dark-first with a full light theme.
   Layout: phone-first app shell (max 480) with bottom tabs; desktop widens to a two-pane shell at 900px+. */
:root{
  --bg:#0A1220; --bg2:#0D1729; --card:#111C30; --card2:#162540; --line:#1F2E4A; --line2:#2A3D60;
  --text:#F4F6FA; --text2:#A9B4C8; --text3:#6F7D96;
  --act:#FF6A1A; --act-ink:#140600; --act-soft:rgba(255,106,26,.14);
  --blue:#2F6BFF; --blue-soft:rgba(47,107,255,.16);
  --data:#38BDF8; --data-soft:rgba(56,189,248,.14);
  --good:#22C55E; --good-soft:rgba(34,197,94,.14);
  --warn:#F59E0B; --warn-soft:rgba(245,158,11,.14);
  --crit:#F0524A; --crit-soft:rgba(240,82,74,.14);
  --ai:#A78BFA; --ai-soft:rgba(167,139,250,.14);
  --head:"Archivo",system-ui,sans-serif; --ui:"Archivo",system-ui,sans-serif; --num:"JetBrains Mono",ui-monospace,monospace;
  --r:10px; --r-sm:6px;
  color-scheme:dark;
}
@media (prefers-color-scheme: light){:root:not([data-theme="dark"]){
  --bg:#F3F5F9; --bg2:#EAEEF5; --card:#FFFFFF; --card2:#F6F8FC; --line:#DCE2EC; --line2:#C7D0DE;
  --text:#0B1324; --text2:#4A5670; --text3:#7A869C;
  --act:#E85A0C; --act-ink:#FFFFFF; --act-soft:rgba(232,90,12,.10);
  --blue:#1D4ED8; --blue-soft:rgba(29,78,216,.10);
  --data:#0284C7; --data-soft:rgba(2,132,199,.10);
  --good:#15803D; --good-soft:rgba(21,128,61,.10);
  --warn:#B45309; --warn-soft:rgba(180,83,9,.10);
  --crit:#C62828; --crit-soft:rgba(198,40,40,.09);
  --ai:#6D28D9; --ai-soft:rgba(109,40,217,.09);
  color-scheme:light}}
:root[data-theme="light"]{
  --bg:#F3F5F9; --bg2:#EAEEF5; --card:#FFFFFF; --card2:#F6F8FC; --line:#DCE2EC; --line2:#C7D0DE;
  --text:#0B1324; --text2:#4A5670; --text3:#7A869C;
  --act:#E85A0C; --act-ink:#FFFFFF; --act-soft:rgba(232,90,12,.10);
  --blue:#1D4ED8; --blue-soft:rgba(29,78,216,.10);
  --data:#0284C7; --data-soft:rgba(2,132,199,.10);
  --good:#15803D; --good-soft:rgba(21,128,61,.10);
  --warn:#B45309; --warn-soft:rgba(180,83,9,.10);
  --crit:#C62828; --crit-soft:rgba(198,40,40,.09);
  --ai:#6D28D9; --ai-soft:rgba(109,40,217,.09);
  color-scheme:light}
*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--text)}
body{margin:0;font-family:var(--ui);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:100;background:var(--bg)}
button{font-family:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--act);outline-offset:2px}
input,select{font-family:inherit}
.num{font-family:var(--num);font-variant-numeric:tabular-nums}
#boot{text-align:center;padding:80px 16px;color:var(--text3);letter-spacing:.2em;font-size:12px}

/* ---------- shell ---------- */
.shell{max-width:480px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;position:relative}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:40;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(14px);border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px))}
.top .side{font:700 11px/1 var(--ui);letter-spacing:.12em;text-transform:uppercase;padding:6px 9px;border-radius:var(--r-sm);border:1px solid var(--line2);color:var(--text2)}
.iconbtn{background:none;border:1px solid var(--line);border-radius:var(--r-sm);height:34px;min-width:34px;padding:0 10px;font-size:13px;color:var(--text2)}
.main{flex:1;padding:16px max(16px,env(safe-area-inset-right,0px)) calc(96px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:18px}
.tabs{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;z-index:50;background:color-mix(in srgb,var(--bg) 95%,transparent);backdrop-filter:blur(14px);border-top:1px solid var(--line);display:flex;padding:8px max(6px,env(safe-area-inset-right,0px)) calc(10px + env(safe-area-inset-bottom,0px)) max(6px,env(safe-area-inset-left,0px))}
.tab{flex:1;background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:4px;padding:6px 0;color:var(--text3);position:relative;min-height:48px}
.tab svg{width:22px;height:22px}
.tab span{font-size:11px;font-weight:600;letter-spacing:.02em}
.tab.on{color:var(--text)}
.tab.on svg{color:var(--act)}
.tab .dot{position:absolute;top:4px;right:calc(50% - 16px);width:8px;height:8px;border-radius:50%;background:var(--act)}

/* ---------- type ---------- */
.eyebrow{font:700 11px/1.2 var(--ui);letter-spacing:.14em;text-transform:uppercase;color:var(--text3)}
.h1{font:900 26px/1.1 var(--head);font-stretch:112%;letter-spacing:-.01em;margin:4px 0 0;text-wrap:balance}
.h2{font:800 18px/1.2 var(--head);font-stretch:108%;margin:0}
.h3{font:700 15px/1.25 var(--ui);margin:0}
.sub{color:var(--text2);font-size:14px;margin:4px 0 0}
.small{font-size:13px;color:var(--text2)}
.tiny{font-size:12px;color:var(--text3)}
.sect{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-bottom:10px}
.link{background:none;border:0;color:var(--blue);font-weight:600;font-size:13px;padding:0}

/* ---------- surfaces ---------- */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.card.flat{padding:0;overflow:hidden}
.row{display:flex;align-items:center;gap:12px}
.list>*+*{border-top:1px solid var(--line)}
.li{display:flex;align-items:center;gap:12px;padding:12px 14px;width:100%;background:none;border:0;text-align:left;min-height:56px}
.grow{flex:1;min-width:0}
.ava{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:15px;flex-shrink:0;background:var(--blue-soft);color:var(--blue)}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:12px}
.kpi b{display:block;font:700 22px/1.1 var(--num);letter-spacing:-.02em}
.kpi small{display:block;font-size:12px;color:var(--text2);margin-top:4px}
.kpi i{font-style:normal;font-size:11.5px;font-weight:600}
.bar{height:6px;border-radius:6px;background:var(--line)}
.bar>div{height:100%;border-radius:6px;transition:width .5s}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;padding:4px 9px;border-radius:999px;border:1px solid var(--line2);color:var(--text2);background:none;white-space:nowrap}
.chip.on{background:var(--text);color:var(--bg);border-color:var(--text)}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.label{display:inline-flex;align-items:center;gap:5px;font:700 10.5px/1 var(--ui);letter-spacing:.08em;text-transform:uppercase;padding:4px 7px;border-radius:4px}
.l-data{background:var(--data-soft);color:var(--data)}
.l-insight{background:var(--warn-soft);color:var(--warn)}
.l-ai{background:var(--ai-soft);color:var(--ai)}
.l-dec{background:var(--good-soft);color:var(--good)}
.l-crit{background:var(--crit-soft);color:var(--crit)}

/* ---------- buttons ---------- */
.btn{border:0;border-radius:var(--r-sm);font:800 14px/1 var(--ui);letter-spacing:.02em;padding:0 16px;min-height:44px;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn.act{background:var(--act);color:var(--act-ink)}
.btn.sec{background:var(--blue);color:#fff}
.btn.ghost{background:none;border:1px solid var(--line2);color:var(--text)}
.btn.block{width:100%}
.btn.sm{min-height:34px;font-size:13px;padding:0 12px}
.btn:disabled{opacity:.45;cursor:default}

/* ---------- inputs ---------- */
.field{width:100%;background:var(--bg2);border:1px solid var(--line);border-radius:var(--r-sm);color:var(--text);font-size:15px;padding:11px 12px}
.cell{width:100%;background:var(--bg2);border:1px solid var(--line);border-radius:var(--r-sm);color:var(--text);font:700 15px/1 var(--num);padding:10px 4px;text-align:center}

/* ---------- triage ---------- */
.tri{display:grid;grid-template-columns:4px 1fr;gap:0 12px;padding:12px 14px 12px 0}
.tri .stripe{border-radius:0 4px 4px 0}
.tri .acts{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}

/* ---------- player ---------- */
.video{aspect-ratio:16/10;max-width:100%;border-radius:var(--r);background:linear-gradient(150deg,var(--card2),var(--bg2));border:1px solid var(--line);display:grid;place-items:center;position:relative;overflow:hidden}
.video svg{width:96px;height:96px;color:var(--text3)}
.video .tag{position:absolute;left:10px;top:10px}
.sets{display:grid;grid-template-columns:34px 1fr 1fr 1fr 44px;gap:8px;align-items:center}
.tick{width:44px;height:44px;border-radius:50%;border:1.5px solid var(--line2);background:none;font-size:18px;display:grid;place-items:center}
.tick.on{background:var(--good);border-color:var(--good);color:#04130A}
.rest{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));width:calc(100% - 32px);max-width:448px;z-index:60;background:var(--text);color:var(--bg);border-radius:var(--r);padding:12px 14px;display:flex;align-items:center;gap:12px;box-shadow:0 12px 30px rgba(0,0,0,.35)}
.rest b{font:700 26px/1 var(--num)}
.rpe{display:flex;gap:6px}
.rpe button{flex:1;min-height:40px;border-radius:var(--r-sm);border:1px solid var(--line2);background:none;font:700 14px/1 var(--num)}
.rpe button.on{background:var(--act);color:var(--act-ink);border-color:var(--act)}

/* ---------- sheet & toast ---------- */
.scrim{position:fixed;inset:0;background:rgba(3,7,15,.55);z-index:80;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--card);border:1px solid var(--line);border-radius:16px 16px 0 0;width:100%;max-width:480px;padding:18px max(16px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:14px;max-height:85vh;overflow:auto}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(92px + env(safe-area-inset-bottom,0px));z-index:90;background:var(--good);color:#04130A;font-weight:700;font-size:14px;padding:10px 16px;border-radius:999px;white-space:nowrap}

/* ---------- builder ---------- */
.ex{display:grid;grid-template-columns:28px 1fr auto;gap:10px;align-items:center;padding:12px 14px}
.grp{font:800 12px/1 var(--num);color:var(--blue);background:var(--blue-soft);border-radius:4px;padding:5px 0;text-align:center}
.mini{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-top:8px}
.mini label{font-size:10.5px;color:var(--text3);font-weight:600;letter-spacing:.04em;text-transform:uppercase;display:flex;flex-direction:column;gap:4px}
.mini input{width:100%;background:var(--bg2);border:1px solid var(--line);border-radius:4px;color:var(--text);font:700 14px/1 var(--num);padding:8px 2px;text-align:center}
.hit{padding:10px 14px;display:flex;gap:10px;align-items:center;width:100%;background:none;border:0;text-align:left}
.hit mark{background:var(--act-soft);color:var(--act);border-radius:3px;padding:0 2px}

/* ---------- selector ---------- */
.sel{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:48px max(16px,env(safe-area-inset-right,0px)) 48px max(16px,env(safe-area-inset-left,0px));gap:28px;background:radial-gradient(120% 70% at 85% -10%,var(--act-soft),transparent 60%),radial-gradient(90% 60% at 0% 110%,var(--blue-soft),transparent 60%),var(--bg)}
.wordmark{display:flex;align-items:center;gap:10px}
.wordmark b{font:900 30px/1 var(--head);font-stretch:125%;letter-spacing:.02em}
.pick{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px;width:100%;max-width:720px}
.pick button{text-align:left;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:22px;display:flex;flex-direction:column;gap:12px;transition:transform .2s,border-color .2s}
.pick button:hover{transform:translateY(-2px);border-color:var(--line2)}
.pick ul{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:7px;font-size:14px;color:var(--text2)}
.pick li{display:flex;gap:8px}
.pick li::before{content:"";width:6px;height:6px;margin-top:7px;border-radius:1px;background:var(--act);flex-shrink:0;transform:rotate(45deg)}
.pick .cl li::before{background:var(--data)}

@media (min-width:900px){
  .shell.wide{max-width:1100px}
  .shell.wide .main{display:grid;grid-template-columns:1fr 1fr;align-items:start}
  .shell.wide .main>.full{grid-column:1/-1}
  .shell.wide .tabs{max-width:1100px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

function ThemeBtn(){

function Spark({data,unit}){
  const w=300,h=70,mn=Math.min(...data)-2,mx=Math.max(...data)+2;
  const pts=data.map((v,i)=>[i*(w/(data.length-1)),h-((v-mn)/(mx-mn))*h]);
  const d=pts.map((p,i)=>`${i?"L":"M"}${p[0].toFixed(1)} ${p[1].toFixed(1)}`).join("");
  const last=pts.at(-1);
  return (<div>
    <svg viewBox={`-4 -6 ${w+8} ${h+12}`} style={{width:"100%",height:80,display:"block"}} role="img" aria-label={`Trend from ${data[0]} to ${data.at(-1)} ${unit}`}>
      <path d={`${d}L${w} ${h}L0 ${h}Z`} fill="var(--data-soft)"/><path d={d} fill="none" stroke="var(--data)" strokeWidth="2.5" strokeLinejoin="round"/>
      <circle cx={last[0]} cy={last[1]} r="4.5" fill="var(--act)"/>
    </svg>
    <div className="row" style={{justifyContent:"space-between"}}><span className="tiny num">{data[0]} {unit}</span><span className="num" style={{fontWeight:700,color:"var(--act)"}}>{data.at(-1)} {unit} (+{data.at(-1)-data[0]})</span></div>
  </div>);
}

function AiAdjust({workout,onClose,onApply}){
  const [mode,setMode]=useState(null);
  const proposals={
    short:{ title:"30-minute version", note:"Drops the finisher, trims rest by 30 s and cuts the main lift to 3 sets.", make:w=>({...w,minutes:30,items:w.items.filter(i=>i.group!=="C").map(i=>({...i,sets:i.group==="A"?3:i.sets,rest:Math.max(0,i.rest-30)}))}) },
    beginner:{ title:"Beginner version", note:"Swaps the trap bar for a goblet squat, lowers RPE targets by 1 and adds reps.", make:w=>({...w,items:w.items.map(i=>i.group==="A"?{...i,exId:9,kg:16,reps:"8",rpe:i.rpe-1}:{...i,rpe:i.rpe-1})}) },
  };
  const p=mode&&proposals[mode]; const next=p&&p.make(workout);
  return <Sheet onClose={onClose}>
    <div className="row"><Label kind="ai">AI suggestion</Label><span className="tiny">You review every change before it applies</span></div>
    <h2 className="h2">Adjust this workout</h2>
    <div className="chips">{Object.entries(proposals).map(([k,v])=><button key={k} className={`chip ${mode===k?"on":""}`} onClick={()=>setMode(k)}>{v.title}</button>)}</div>
    {!p && <p className="small" style={{margin:0}}>Pick an adjustment to see the proposed changes.</p>}
    {p && <>
      <p className="small" style={{margin:0}}>{p.note}</p>
      <div className="card flat list">
        {workout.items.map(it=>{const n=next.items.find(x=>x.key===it.key);const ex=exById(it.exId);
          if(!n) return <div key={it.key} className="li"><span className="label l-crit">Removed</span><span className="small" style={{textDecoration:"line-through"}}>{ex.name}</span></div>;
          const changed=n.exId!==it.exId||n.sets!==it.sets||n.rest!==it.rest||n.rpe!==it.rpe;
          return <div key={it.key} className="li"><span className={`label ${changed?"l-ai":"l-data"}`}>{changed?"Changed":"Same"}</span><div className="grow small"><b style={{color:"var(--text)"}}>{exById(n.exId).name}</b> <span className="num">{n.sets}×{n.reps} · RPE {n.rpe} · {fmtRest(n.rest)}</span></div></div>;})}
      </div>
      <div className="row"><button className="btn ghost" style={{flex:1}} onClick={onClose}>Reject</button><button className="btn act" style={{flex:2}} onClick={()=>onApply(next,`${p.title} applied · logged as your decision`)}>Accept changes</button></div>
    </>}
  </Sheet>;
}

function Player({store,onExit,onDone}){
  const w=store.workout;
  const [idx,setIdx]=useState(0);
  const [state,setState]=useState(()=>Object.fromEntries(w.items.map(it=>[it.key,Array.from({length:it.sets},()=>({kg:it.kg||"",reps:String(it.reps).replace("s",""),done:false}))])));
  const [rpe,setRpe]=useState({});
  const [rest,setRest]=useState(null);
  const [cues,setCues]=useState(false);
  const [finish,setFinish]=useState(false);
  const [sessionRpe,setSessionRpe]=useState(null);
  const startT=useRef(Date.now());
  useEffect(()=>{ if(!rest) return; if(rest.left<=0){ try{navigator.vibrate&&navigator.vibrate(200);}catch(e){} setRest(null); return; } const id=setTimeout(()=>setRest(r=>r&&{...r,left:r.left-1}),1000); return ()=>clearTimeout(id); },[rest]);
  const it=w.items[idx]; const ex=exById(it.exId); const sets=state[it.key];

  const upd=(i,f,v)=>setState(s=>({...s,[it.key]:s[it.key].map((x,j)=>j===i?{...x,[f]:v}:x)}));
  const allSets=Object.values(state).flat(); const doneCount=allSets.filter(s=>s.done).length;
  const exDone=sets.every(s=>s.done);
  const isPR = it.key==="a" && sets.some(s=>s.done && Number(s.kg)>67.5);

  if(finish){
    const volume=w.items.reduce((a,x)=>a+state[x.key].filter(s=>s.done).reduce((b,s)=>b+(Number(s.kg)||0)*(Number(s.reps)||0),0),0);

    return <div className="shell"><main className="main" style={{paddingBottom:40}}>

      <h1 className="h1">Nice work, Priya.</h1>

      {prs>0 && <div className="card" style={{background:"var(--act-soft)",borderColor:"var(--act)"}}><div className="h3">🎉 {prs} new personal best{prs>1?"s":""}</div><div className="small">Kamal will see it on the Brief.</div></div>}
      <div className="card"><h3 className="h3" style={{marginBottom:8}}>How hard was the whole session?</h3><div className="rpe">{[6,7,8,9,10].map(n=><button key={n} className={sessionRpe===n?"on":""} onClick={()=>setSessionRpe(n)}>{n}</button>)}</div><div className="tiny" style={{marginTop:6}}>6 = easy, 10 = maximal</div></div>
      <input id="sessionnote" className="field" placeholder="Note for Kamal (optional)"/>
      <button className="btn act block" style={{minHeight:52}} disabled={!sessionRpe} onClick={()=>{store.setLog({name:w.name,sets:doneCount,volume,minutes:Math.max(1,Math.round((Date.now()-startT.current)/60000)),rpe:sessionRpe,prs});onDone();}}>Save and finish</button>
    </main></div>;
  }

  return (
    <div className="shell">
      <div className="top">
        <button className="iconbtn" onClick={onExit}>✕ Exit</button>
        <span className="num small" style={{fontWeight:700}}>{doneCount}/{allSets.length} sets</span>
        <span className="tiny">{idx+1} of {w.items.length}</span>
      </div>
      <div style={{height:4,background:"var(--line)"}}><div style={{height:"100%",width:`${doneCount/allSets.length*100}%`,background:"var(--act)",transition:"width .4s"}}/></div>
      <main className="main" style={{paddingBottom:rest?170:110}}>
        <div className="video"><span className="tag label l-data">{it.group.length>1?`Superset ${it.group}`:`Block ${it.group}`}</span>{I.figure}</div>
        <div>
          <div className="eyebrow">{ex.muscles.join(" · ")}</div>
          <h1 className="h1" style={{fontSize:26}}>{ex.name}</h1>
          <div className="small num" style={{marginTop:4}}>Target {it.sets}×{it.reps}{it.kg?` @ ${it.kg} kg`:""} · RPE {it.rpe} · rest {it.rest?fmtRest(it.rest):"none, go to next"}</div>
          <button className="link" style={{marginTop:6}} onClick={()=>setCues(!cues)}>{cues?"Hide cues":"Show cues"}</button>
          {cues && <ol className="small" style={{margin:"6px 0 0",paddingLeft:20}}>{ex.cues.map(c=><li key={c}>{c}</li>)}</ol>}
        </div>
        <div className="card" style={{padding:"10px 12px"}}>
          <div className="small">Last time: <b className="num" style={{color:"var(--text)"}}>{it.last}</b></div>
        </div>
        <div>
          <div className="sets" style={{marginBottom:6}}>{["Set",it.kg?"kg":"—",String(it.reps).includes("s")?"Secs":"Reps","Target",""].map((h,i)=><span key={i} className="tiny" style={{textAlign:"center",fontWeight:700}}>{h}</span>)}</div>
          {sets.map((s,i)=>(
            <div key={i} className="sets" style={{marginBottom:8,opacity:s.done?.75:1}}>
              <span className="num" style={{textAlign:"center",fontWeight:800,color:s.done?"var(--good)":"var(--text2)"}}>{i+1}</span>
              {it.kg? <input id={`pk-${it.key}-${i}`} className="cell" inputMode="decimal" value={s.kg} onChange={e=>upd(i,"kg",e.target.value)} aria-label={`Set ${i+1} weight`}/> : <span className="tiny" style={{textAlign:"center"}}>BW</span>}
              <input id={`pr-${it.key}-${i}`} className="cell" inputMode="numeric" value={s.reps} onChange={e=>upd(i,"reps",e.target.value)} aria-label={`Set ${i+1} reps`}/>
              <span className="num tiny" style={{textAlign:"center"}}>{it.reps}</span>
              <button className={`tick ${s.done?"on":""}`} onClick={()=>tog(i)} aria-label={`Complete set ${i+1}`}>✓</button>
            </div>
          ))}
        </div>
        {isPR && <div className="card" style={{background:"var(--act-soft)",borderColor:"var(--act)",padding:"10px 12px"}}><b>🎉 New personal best</b> <span className="small">on {ex.name}</span></div>}
        {exDone && <div className="card"><h3 className="h3" style={{marginBottom:8}}>How hard was that? (RPE)</h3><div className="rpe">{[6,7,8,9,10].map(n=><button key={n} className={rpe[it.key]===n?"on":""} onClick={()=>setRpe(r=>({...r,[it.key]:n}))}>{n}</button>)}</div></div>}
      </main>
      {rest && <div className="rest" role="timer" aria-live="polite"><div className="grow"><div className="tiny" style={{color:"inherit",opacity:.7}}>Rest</div><b>{fmtRest(rest.left)}</b></div><button className="btn sm" style={{background:"var(--bg)",color:"var(--text)"}} onClick={()=>setRest(r=>({...r,left:r.left+30}))}>+30 s</button><button className="btn act sm" onClick={()=>setRest(null)}>Skip</button></div>}
      <nav className="tabs" style={{gap:8,padding:"10px 16px calc(12px + env(safe-area-inset-bottom,0px))"}}>
        <button className="btn ghost" style={{flex:1}} disabled={idx===0} onClick={()=>{setIdx(idx-1);setCues(false);}}>Back</button>
        {idx<w.items.length-1
          ? <button className={`btn ${exDone?"act":"ghost"}`} style={{flex:2}} onClick={()=>{setIdx(idx+1);setCues(false);window.scrollTo(0,0);}}>Next: {exById(w.items[idx+1].exId).name}</button>
          : <button className="btn act" style={{flex:2}} onClick={()=>setFinish(true)}>Finish workout</button>}
      </nav>
    </div>
  );
}

function Progress(){
  const [photos,setPhotos]=useState(false);
  return (<>
    <div><div className="eyebrow">Progress</div><h1 className="h1">8 weeks in</h1></div>
    <div className="kpis" style={{gridTemplateColumns:"repeat(2,1fr)"}}>
      <div className="kpi"><b>62.3</b><small>Weight, kg</small><i style={{color:"var(--good)"}}>−1.2 since start</i></div>
      <div className="kpi"><b>70</b><small>Trap bar, kg × 5</small><i style={{color:"var(--good)"}}>+15 since start</i></div>
    </div>
    <div className="card"><div className="sect" style={{marginBottom:6}}><h3 className="h3">Trap bar deadlift, top set</h3></div><Spark data={[55,57.5,60,62.5,62.5,65,67.5,70]} unit="kg"/></div>
    <button className="card" style={{textAlign:"left",display:"flex",justifyContent:"space-between",alignItems:"center",width:"100%"}} onClick={()=>setPhotos(!photos)}><div><div className="h3">Progress photos</div><div className="small">Start · week 4 · now</div></div><span className="h2">{photos?"–":"+"}</span></button>
    {photos && <div style={{display:"grid",gridTemplateColumns:"repeat(3,1fr)",gap:8}}>{["Start","Week 4","Now"].map((l,i)=><div key={l} style={{textAlign:"center"}}><div className="video" style={{aspectRatio:"3/4",borderColor:i===2?"var(--good)":undefined}}>{React.cloneElement(I.figure,{width:48,height:48})}</div><div className="tiny" style={{marginTop:4}}>{l}</div></div>)}</div>}
    <section><div className="sect"><h2 className="h2">Recovery</h2><Label kind="data">From Apple Health</Label></div>
      <div className="card flat list">{[["Sleep","7 h 24 m",82,"var(--data)"],["Resting HR","58 bpm",70,"var(--good)"],["Steps","8,412",84,"var(--act)"]].map(r=><div key={r[0]} className="li"><div className="grow"><div className="row" style={{justifyContent:"space-between"}}><span className="h3">{r[0]}</span><span className="num" style={{fontWeight:700}}>{r[1]}</span></div><div style={{marginTop:6}}><Bar pct={r[2]} color={r[3]}/></div></div></div>)}</div>
    </section>
  </>);
}

function Chat({store}){
  const [t,setT]=useState(""); const end=useRef(null);
  useEffect(()=>{ end.current&&end.current.scrollIntoView({block:"end"}); },[store.messages.length]);
  const send=()=>{ if(!t.trim()) return; store.setMessages(m=>[...m,{from:"client",text:t.trim(),time:"Now"}]); setT(""); };
  return (<>
    <div className="row"><Ava c="K" tone="var(--act)"/><div><h1 className="h1" style={{fontSize:20}}>Coach Kamal</h1><div className="tiny">Usually replies within a few hours</div></div></div>
    <div style={{display:"flex",flexDirection:"column",gap:8}}>
      {store.messages.map((m,i)=><div key={i} style={{alignSelf:m.from==="client"?"flex-end":"flex-start",maxWidth:"82%",background:m.from==="client"?"var(--blue)":"var(--card)",color:m.from==="client"?"#fff":"var(--text)",border:m.from==="client"?"none":"1px solid var(--line)",borderRadius:12,padding:"10px 12px"}}><div>{m.text}</div><div style={{fontSize:11,opacity:.7,marginTop:4,textAlign:"right"}}>{m.time}</div></div>)}
      <div ref={end}/>
    </div>
    <div className="row" style={{position:"sticky",bottom:"calc(84px + env(safe-area-inset-bottom,0px))"}}>
      <input id="chatbox" className="field" placeholder="Message Kamal" value={t} onChange={e=>setT(e.target.value)} onKeyDown={e=>{if(e.key==="Enter")send();}}/>
      <button className="btn act" onClick={send} disabled={!t.trim()}>Send</button>
    </div>
  </>);
}

function More(){
  const [view,setView]=useState(null);
  if(view==="food") return (<><button className="link" onClick={()=>setView(null)} style={{alignSelf:"flex-start"}}>← More</button><ClientNutrition/></>);
  if(view==="community") return (<><button className="link" onClick={()=>setView(null)} style={{alignSelf:"flex-start"}}>← More</button><Community/></>);
  if(view==="habits") return (<><button className="link" onClick={()=>setView(null)} style={{alignSelf:"flex-start"}}>← More</button><Habits/></>);
  return (<>
    <div><div className="eyebrow">More</div><h1 className="h1">Everything else</h1></div>
    <div className="card flat list">
      {[["food","Nutrition","1,432 of 1,900 kcal logged today"],["habits","Habits","2 of 3 done today"],["community","Community","Leaderboard and team feed"]].map(([k,t,s])=><button key={k} className="li" onClick={()=>setView(k)}><div className="grow"><div className="h3">{t}</div><div className="small">{s}</div></div><span className="tiny">›</span></button>)}
      {[["Goals","Trap bar 80 kg × 5 by 20 December"],["Settings","Units, notifications, connected apps"]].map(([t,s])=><div key={t} className="li"><div className="grow"><div className="h3">{t}</div><div className="small">{s}</div></div></div>)}
    </div>
  </>);
}

function ClientNutrition(){
  const [log,setLog]=useState([FOODS[4],FOODS[3],FOODS[0],FOODS[1]]);
  const [q,setQ]=useState("");
  const tot=log.reduce((a,f)=>({kcal:a.kcal+f.kcal,p:a.p+f.p,c:a.c+f.c,f:a.f+f.f}),{kcal:0,p:0,c:0,f:0});
  const tg={kcal:1900,p:120,c:210,f:60};
  const hits=FOODS.filter(f=>f.name.toLowerCase().includes(q.toLowerCase()));
  return (<>
    <div><div className="eyebrow">Nutrition</div><h1 className="h1"><span className="num">{tot.kcal.toLocaleString()}</span> / {tg.kcal.toLocaleString()} kcal</h1></div>
    <div className="card" style={{display:"flex",flexDirection:"column",gap:10}}>
      {[["Protein",tot.p,tg.p,"var(--crit)"],["Carbs",tot.c,tg.c,"var(--data)"],["Fat",tot.f,tg.f,"var(--warn)"]].map(([l,v,t,c])=><div key={l}><div className="row" style={{justifyContent:"space-between",marginBottom:4}}><span className="small">{l}</span><span className="num small" style={{fontWeight:700,color:"var(--text)"}}>{v} / {t} g</span></div><Bar pct={v/t*100} color={c}/></div>)}
    </div>
    <div className="card flat list">{log.map((f,i)=><div key={f.id} className="li"><div className="grow"><div className="h3">{f.name}</div><div className="tiny num">P {f.p} · C {f.c} · F {f.f}</div></div><span className="num small">{f.kcal}</span><button className="iconbtn" aria-label={`Remove ${f.name}`} onClick={()=>setLog(l=>l.filter((_,j)=>j!==i))}>×</button></div>)}</div>
    <input id="foodsearch" className="field" placeholder="Search foods or scan a barcode" value={q} onChange={e=>setQ(e.target.value)}/>
    {q && <div className="card flat list">{hits.length===0?<div className="li small">No match in the sample list.</div>:hits.map(f=>{const inL=log.some(l=>l.id===f.id);return <div key={f.id} className="li"><div className="grow"><div className="h3">{f.name}</div><div className="tiny num">{f.kcal} kcal</div></div><button className={`btn sm ${inL?"ghost":"act"}`} disabled={inL} onClick={()=>setLog(l=>[...l,f])}>{inL?"Added":"Add"}</button></div>;})}</div>}
  </>);
}

function Habits(){
  const [h,setH]=useState({water:true,steps:true,sleep:false});
  return (<>
    <div><div className="eyebrow">Habits</div><h1 className="h1">{Object.values(h).filter(Boolean).length} of 3 today</h1></div>
    <div className="card flat list">{[["water","Drink 2.5 L water"],["steps","8,000 steps"],["sleep","In bed by 10:30 pm"]].map(([k,t])=><label key={k} className="li" style={{cursor:"pointer"}}><input type="checkbox" checked={h[k]} onChange={e=>setH(s=>({...s,[k]:e.target.checked}))} style={{width:22,height:22,accentColor:"var(--good)"}}/><span className="h3">{t}</span></label>)}</div>
  </>);
}

function Community(){
  const [liked,setLiked]=useState({});
  const board=[...CLIENTS].sort((a,b)=>b.adherence-a.adherence).slice(0,4);
  return (<>
    <div><div className="eyebrow">Community</div><h1 className="h1">This week</h1></div>
    <div className="card flat list">{board.map((c,i)=><div key={c.id} className="li"><span className="num" style={{width:20,fontWeight:800,color:i===0?"var(--act)":"var(--text3)"}}>{i+1}</span><Ava c={c.ini} size={32}/><div className="grow"><div className="h3">{c.name.split(" ")[0]} {c.name.split(" ")[1][0]}.</div><div className="tiny">🔥 {c.streak} days</div></div><span className="num" style={{fontWeight:700}}>{c.adherence}%</span></div>)}</div>
    {[["Omar T.","New squat PR today, 100 kg! Eight weeks of steady work.",24],["James K.","Four strict pull-ups in a row. Six months ago I couldn't do one.",31]].map(([u,t,l],i)=><div key={i} className="card"><div className="h3">{u}</div><p className="small" style={{margin:"6px 0 10px",color:"var(--text)"}}>{t}</p><button className="chip" onClick={()=>setLiked(s=>({...s,[i]:!s[i]}))} style={liked[i]?{borderColor:"var(--act)",color:"var(--act)"}:null}>♥ {l+(liked[i]?1:0)}</button></div>)}
  </>);
}

ReactDOM.createRoot(document.getElementById("root")).render(<Root/>);
</script>
