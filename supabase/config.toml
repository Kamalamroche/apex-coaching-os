# Supabase CLI project config. Run `supabase start` for a local stack, `supabase db push` to deploy migrations.
project_id = "apex-coaching-os"

[api]
port = 54321
schemas = ["public"]

[db]
port = 54322
major_version = 16

[db.seed]
enabled = true
sql_paths = ["./seed.sql"]

[auth]
site_url = "http://localhost:5173"
additional_redirect_urls = ["http://localhost:5173/coach/", "http://localhost:5173/client/"]
