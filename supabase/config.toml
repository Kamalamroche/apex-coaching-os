# Supabase CLI project config. Run `supabase start` for a local stack, `supabase db push` to deploy migrations.
project_id = "apex-coaching-os"

[api]
port = 54321
schemas = ["public"]

[db]
port = 54322
major_version = 17

[db.seed]
enabled = true
sql_paths = ["./seed.sql"]

[auth]
site_url = "http://localhost:5173"
additional_redirect_urls = ["http://localhost:5173/**", "http://127.0.0.1:5173/**"]

# Called by a Supabase Cron job, which checks its own x-cron-secret header instead of a user token.
[functions.email-alerts]
verify_jwt = false

# Stripe calls the webhook without a Supabase sign-in; the function checks Stripe's signature itself.
[functions.stripe-webhook]
verify_jwt = false
